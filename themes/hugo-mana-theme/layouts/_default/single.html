{{ define "main" }}
<article class="prose">
  <h1>{{ .Title }}</h1>
  <div class="meta">
    {{ .Date.Format "January 02, 2006" }}
    {{ if .ReadingTime }}· {{ .ReadingTime }} min read{{ end }}
    {{ if .Params.tags }}
    <span style="margin-left:0.5rem">
      {{ range .Params.tags }}<span class="tag">{{ . }}</span> {{ end }}
    </span>
    {{ end }}
  </div>
  {{ .Content }}
</article>
{{ end }}
